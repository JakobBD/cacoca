[project]
name = "cacoca"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Jakob Duerrwaechter", email = "jakob.duerrwaechter@pik-potsdam.de" }
]

dependencies = [
  "plotly >=5.13.1,<6.0.0",
  "pandas >=1.5.3",
  "numpy >=2.2.6",
  "openpyxl >=3.1.2,<4.0.0",
  "numpy-financial >=1.0.0,<2.0.0",
  "nbformat >=5.8.0,<6.0.0",
  "pyyaml >=6.0,<7.0",
  "kaleido ==0.1.0",
  "posted",
  "team",
]

[project.optional-dependencies]
dev = ["ipykernel >=6.22.0,<7.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cacoca", "posted_coupling"]

[tool.uv.sources]
posted = { git = "https://github.com/PhilippVerpoort/posted", tag = "v0.5.3" }
team = { git = "https://github.com/PhilippVerpoort/team.git", rev = "15187b34e67c24e13f93db66e12635ab258adcf7" }
